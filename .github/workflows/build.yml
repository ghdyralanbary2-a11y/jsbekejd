name: Build Levi AI
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Write app
        run: |
          mkdir -p www
          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <title>ليفاي</title>
          <style>
          :root{--bg:#0b1020;--sf:#141a2e;--sf2:#1c2440;--tx:#e8ecf8;--mu:#8b94b3;--ac:#7c5cff;--ac2:#22d3ee}
          *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
          body{background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column}
          header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
          header b{font-size:17px}
          header small{display:block;color:var(--mu);font-size:12px;text-align:center}
          .hb{background:none;border:0;color:var(--mu);width:40px;height:40px;border-radius:12px;font-size:19px}
          .hb:active{background:var(--sf)}
          #chat{flex:1;overflow-y:auto;padding:6px 16px 16px;display:flex;flex-direction:column;gap:18px}
          .logo{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;color:#fff}
          .hero{margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px}
          .hero h2{font-size:26px;font-weight:600}
          .hero p{color:var(--mu)}
          .chips{display:flex;flex-direction:column;gap:8px;width:100%;max-width:340px;margin-top:8px}
          .chip{background:var(--sf);border:1px solid var(--sf2);color:var(--tx);padding:12px 14px;border-radius:14px;font:inherit;font-size:15px}
          .chip:active{background:var(--sf2)}
          .u{align-self:flex-start;max-width:85%;background:var(--sf2);padding:10px 16px;border-radius:20px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
          .a{align-self:stretch;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere}
          .a:before{content:"✦";display:block;color:var(--ac2);font-size:18px;margin-bottom:4px}
          pre{background:#070a16;border:1px solid var(--sf2);padding:12px;border-radius:12px;overflow-x:auto;margin:8px 0;white-space:pre;direction:ltr;text-align:left}
          code{font-family:monospace;font-size:14px}
          .dots span{display:inline-block;width:8px;height:8px;margin:0 2px;background:var(--ac2);border-radius:50%;animation:b 1s infinite}
          .dots span:nth-child(2){animation-delay:.15s}
          .dots span:nth-child(3){animation-delay:.3s}
          @keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}
          #bar{padding:8px 12px max(12px,env(safe-area-inset-bottom))}
          #box{display:flex;align-items:flex-end;gap:8px;background:var(--sf);border:1px solid var(--sf2);border-radius:28px;padding:8px}
          #box:focus-within{border-color:var(--ac)}
          #in{flex:1;background:none;color:var(--tx);border:0;padding:9px 12px;font:inherit;resize:none;max-height:140px;outline:none}
          #in::placeholder{color:var(--mu)}
          #go{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:50%;width:42px;height:42px;font-size:19px;flex:none}
          #go:disabled{opacity:.4}
          #setup{position:fixed;inset:0;background:#0b1020f5;display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
          #setup>div{background:var(--sf);padding:22px;border-radius:20px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--sf2)}
          #setup small{color:var(--mu);line-height:1.7}
          #setup input{background:var(--bg);color:var(--tx);border:1px solid var(--sf2);border-radius:12px;padding:13px;direction:ltr;font:inherit;outline:none}
          #setup button{border:0;border-radius:12px;padding:12px;font:inherit;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2))}
          #setup button.s{background:var(--sf2);color:var(--mu)}
          </style>
          </head>
          <body>
          <header>
            <button class="hb" id="cfg">🔑</button>
            <div><b>ليفاي</b><small id="st"></small></div>
            <button class="hb" id="clr">✚</button>
          </header>
          <div id="chat"></div>
          <div id="bar"><div id="box"><textarea id="in" rows="1" placeholder="كيف أكدر أساعدك اليوم؟"></textarea><button id="go">↑</button></div></div>
          <div id="setup"><div>
            <b>مفتاح Groq (مجاني، مرة وحدة)</b>
            <small>من console.groq.com/keys سوّي مفتاح وانسخه والصقه هنا. ينحفظ على جهازك.</small>
            <input id="k" placeholder="gsk_..." type="password">
            <button id="sv">حفظ</button>
            <button id="sk" class="s">تخطي (أبطأ وأقل ثباتاً)</button>
          </div></div>
          <script>
          var $=function(s){return document.querySelector(s)};
          var SYS="أنت ليفاي، شاب عراقي ودود وذكي وخفيف دم. تحچي باللهجة العراقية البسيطة، وتجاوب بوضوح واختصار، وتساعد بأي شي: دراسة، برمجة، ترجمة، أفكار، وأمور الحياة. إذا المستخدم كتب بلغة ثانية رد بلغته. إذا سألك بجدية إذا انت ذكاء اصطناعي، قله الحقيقة.";
          var PREF=["openai/gpt-oss-120b","openai/gpt-oss-20b","llama-3.3-70b-versatile","llama-3.1-8b-instant"];
          var key=localStorage.getItem("gk")||"";
          var MODEL=localStorage.getItem("gm")||"";
          var asked=localStorage.getItem("asked")||"";
          var hist=[];try{hist=JSON.parse(localStorage.getItem("levi4")||"[]")}catch(e){}
          var busy=false;
          var BT=String.fromCharCode(96);
          var reBlock=new RegExp(BT+BT+BT+"(\\w*)\\n?([\\s\\S]*?)("+BT+BT+BT+"|$)","g");
          var reInline=new RegExp(BT+"([^"+BT+"\\n]+)"+BT,"g");
          function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
          function md(t){return esc(t).replace(reBlock,"<pre><code>$2</code></pre>").replace(reInline,"<code>$1</code>").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}
          function down(){$("#chat").scrollTop=1e9}
          function add(role,html){
            var d=document.createElement("div");d.className=role==="user"?"u":"a";d.innerHTML=html;
            $("#chat").appendChild(d);down();return d;
          }
          function save(){localStorage.setItem("levi4",JSON.stringify(hist.slice(-40)))}
          function status(){$("#st").textContent=key?("سريع • "+(MODEL||"Groq")):"وضع عادي"}
          function hero(){
            $("#chat").innerHTML='<div class="hero"><div class="logo">L</div><h2>هلا، آني ليفاي</h2><p>شنو تحتاج اليوم؟</p><div class="chips">'
            +'<button class="chip">ساعدني أدرس لامتحان</button>'
            +'<button class="chip">اشرحلي شي ببساطة</button>'
            +'<button class="chip">اكتبلي كود</button></div></div>';
            var cs=document.querySelectorAll(".chip");
            for(var i=0;i<cs.length;i++)cs[i].onclick=function(){$("#in").value=this.textContent;send()};
          }
          function render(){
            if(!hist.length){hero();return}
            $("#chat").innerHTML="";
            hist.forEach(function(m){add(m.role==="user"?"user":"a",md(m.content))});
          }
          render();status();
          if(!key&&!asked)$("#setup").style.display="flex";
          $("#cfg").onclick=function(){$("#k").value="";$("#setup").style.display="flex"};
          $("#sv").onclick=function(){
            var v=$("#k").value.trim();
            if(v){key=v;MODEL="";localStorage.setItem("gk",v);localStorage.removeItem("gm")}
            localStorage.setItem("asked","1");$("#setup").style.display="none";status();
          };
          $("#sk").onclick=function(){localStorage.setItem("asked","1");$("#setup").style.display="none"};
          $("#clr").onclick=function(){hist=[];save();render()};
          $("#in").addEventListener("input",function(){this.style.height="auto";this.style.height=Math.min(this.scrollHeight,140)+"px"});

          async function pickModel(){
            var r=await fetch("https://api.groq.com/openai/v1/models",{headers:{"Authorization":"Bearer "+key}});
            if(!r.ok){
              if(r.status===401){key="";localStorage.removeItem("gk");status()}
              throw new Error("Groq "+r.status+" (تأكد من المفتاح)");
            }
            var j=await r.json();
            var ids=(j.data||[]).map(function(m){return m.id}).filter(function(id){
              return !/whisper|guard|tts|orpheus|playai|safeguard|embed|compound/i.test(id)});
            var pick="";
            for(var i=0;i<PREF.length&&!pick;i++){if(ids.indexOf(PREF[i])>-1)pick=PREF[i]}
            if(!pick)pick=ids[0]||"";
            if(!pick)throw new Error("ما لكيت موديل متاح بحسابك");
            MODEL=pick;localStorage.setItem("gm",pick);status();
          }
          async function callGroq(el){
            var body={model:MODEL,stream:true,temperature:0.7,max_tokens:4096,
              messages:[{role:"system",content:SYS}].concat(hist.slice(-20))};
            if(MODEL.indexOf("gpt-oss")>-1)body.reasoning_effort="low";
            return fetch("https://api.groq.com/openai/v1/chat/completions",{
              method:"POST",
              headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
              body:JSON.stringify(body)
            });
          }
          async function viaGroq(el){
            if(!MODEL)await pickModel();
            var r=await callGroq(el);
            if(r.status===404||r.status===400){
              MODEL="";localStorage.removeItem("gm");
              await pickModel();r=await callGroq(el);
            }
            if(!r.ok){
              var tx=await r.text();
              if(r.status===401){key="";localStorage.removeItem("gk");status()}
              throw new Error("Groq "+r.status+" "+tx.slice(0,140));
            }
            var rd=r.body.getReader(),dc=new TextDecoder(),buf="",out="";
            while(true){
              var x=await rd.read();if(x.done)break;
              buf+=dc.decode(x.value,{stream:true});
              var line
